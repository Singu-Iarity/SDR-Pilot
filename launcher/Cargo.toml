[package]
name = "sdrpilot-launcher"
version = "0.9.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
tao = "0.37.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
wry = "0.57.0"

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "sdrpilot-desktop"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
