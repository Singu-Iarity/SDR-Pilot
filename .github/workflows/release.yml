# Builds the Windows installer and publishes it as a GitHub Release whenever a tag v<build> is pushed
# (build = the stamp in sdrpilot/BUILD, e.g. v0.9.0.20261021.1335). Installed copies of SDR Pilot pick the
# release up as an update; the .sha256 file next to the installer is required by the updater.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match sdrpilot/BUILD
        run: |
          B="$(cat sdrpilot/BUILD)"
          if [ "v$B" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME doesn't match sdrpilot/BUILD ($B)"; exit 1; fi
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build the installer
        run: sh installer/build.sh --keep-build
      - name: Name it by build, add its SHA-256
        run: |
          B="$(cat sdrpilot/BUILD)"; V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sdrpilot/__init__.py)"
          mkdir -p dist
          cp "installer/SDR-Pilot-Setup-$V.exe" "dist/SDR-Pilot-Setup-$B.exe"
          cd dist && sha256sum "SDR-Pilot-Setup-$B.exe" > "SDR-Pilot-Setup-$B.exe.sha256" && cat *.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "SDR Pilot $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
